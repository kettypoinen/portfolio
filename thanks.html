<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Message sent · Ketty Poinen</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600&family=Manrope:wght@400;600;700&family=Dancing+Script:wght@600&display=swap">
<style>
/* Thank-you page after the contact form; FormSubmit redirects here (set in index.html) */
:root{color-scheme:dark;--fg:#E7ECF7;--text:#C2CBE4;--soft:#9AA6C6;--panel:rgba(17,24,50,.72);--line:rgba(120,150,230,.26);--blue:#6AA4F8;--grad:linear-gradient(135deg,#4D86F0,#7C5CF0)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px;color:var(--fg);font:400 16.5px/1.55 'Manrope',system-ui,sans-serif;background:radial-gradient(1100px 700px at 82% -8%,rgba(120,90,220,.2),transparent 60%),radial-gradient(1000px 640px at 12% 4%,rgba(60,110,220,.18),transparent 58%),linear-gradient(#0B1128 0%,#0A0F22 55%,#090D1D 100%);background-attachment:fixed}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background-image:radial-gradient(circle,rgba(170,188,235,.34) 1.15px,transparent 1.5px);background-size:22px 22px;-webkit-mask-image:radial-gradient(1600px 1300px at 50% 30%,#000 78%,transparent 100%);mask-image:radial-gradient(1600px 1300px at 50% 30%,#000 78%,transparent 100%)}
main{position:relative;z-index:1;width:100%;max-width:520px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:36px 28px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;box-shadow:0 10px 26px rgba(4,7,20,.5)}
.avatar{width:72px;height:72px;border-radius:50%;object-fit:cover;padding:3px;background:var(--grad)}
h1{margin:0;font:600 clamp(36px,7vw,46px)/1.1 'Dancing Script',cursive;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
p{margin:0;color:var(--text);max-width:30em}
.small{color:var(--soft);font-size:14.5px}
a.back{margin-top:8px;display:inline-flex;align-items:center;min-height:44px;padding:12px 24px;border-radius:10px;background:linear-gradient(135deg,#3A6FD8,#6A4BDE);color:#fff;font:700 15px/1 'Manrope',system-ui,sans-serif;text-decoration:none}
a.back:hover{filter:brightness(1.15)}
a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
</style>
</head>
<body>
<main>
  <img class="avatar" src="assets/profile.jpg" alt="Ketty Poinen">
  <h1>Thank You</h1>
  <p>Your message is on its way to me.</p>
  <p class="small">Ketty Poinen · Fractional AI consultant with a finance edge</p>
  <a class="back" href="index.html">Back to the page</a>
</main>
</body>
</html>
