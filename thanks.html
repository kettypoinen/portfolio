<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Message sent · Ketty Poinen</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600&family=Manrope:wght@400;600;700&family=Dancing+Script:wght@600&display=swap">
<script>/* same saved choice as the main page */(function(){try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}})()</script>
<style>
/* Thank-you page after the contact form (index.html sends visitors here). Dark is the base design; light follows the main page's saved choice, then the device setting */
:root{color-scheme:dark;--fg:#E7ECF7;--text:#C2CBE4;--soft:#9AA6C6;--panel:#0F162E;--line:rgba(120,150,230,.26);--blue:#6AA4F8;--grad:linear-gradient(135deg,#4D86F0,#7C5CF0);--grad-btn:linear-gradient(135deg,#3A6FD8,#6A4BDE);
  --bg-r1:rgba(120,90,220,.2);--bg-r2:rgba(60,110,220,.18);--bg-top:#0B1128;--bg:#0A0F22;--bg2:#090D1D;--dots:rgba(170,188,235,.34);--shadow:rgba(4,7,20,.5)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){color-scheme:light;--fg:#0F1730;--text:#2E3850;--soft:#4F5B75;--panel:#FFFFFF;--line:rgba(40,70,150,.2);--blue:#1F55C8;--grad:linear-gradient(135deg,#2F63D6,#6B44D8);--grad-btn:linear-gradient(135deg,#2A5BC8,#5E3CCB);
  --bg-r1:rgba(120,90,220,.07);--bg-r2:rgba(60,110,220,.07);--bg-top:#F7F8FC;--bg:#F4F6FB;--bg2:#EDF0F7;--dots:rgba(40,60,120,.17);--shadow:rgba(20,30,70,.10)}}
:root[data-theme="light"]{color-scheme:light;--fg:#0F1730;--text:#2E3850;--soft:#4F5B75;--panel:#FFFFFF;--line:rgba(40,70,150,.2);--blue:#1F55C8;--grad:linear-gradient(135deg,#2F63D6,#6B44D8);--grad-btn:linear-gradient(135deg,#2A5BC8,#5E3CCB);
  --bg-r1:rgba(120,90,220,.07);--bg-r2:rgba(60,110,220,.07);--bg-top:#F7F8FC;--bg:#F4F6FB;--bg2:#EDF0F7;--dots:rgba(40,60,120,.17);--shadow:rgba(20,30,70,.10)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px;color:var(--fg);font:400 16.5px/1.55 'Manrope',system-ui,sans-serif;background-color:var(--bg);background-image:radial-gradient(1100px 700px at 82% -8%,var(--bg-r1),transparent 60%),radial-gradient(1000px 640px at 12% 4%,var(--bg-r2),transparent 58%),linear-gradient(var(--bg-top) 0%,var(--bg) 55%,var(--bg2) 100%);background-attachment:fixed}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background-image:radial-gradient(circle,var(--dots) 1.15px,transparent 1.5px);background-size:22px 22px;-webkit-mask-image:radial-gradient(1600px 1300px at 50% 30%,#000 78%,transparent 100%);mask-image:radial-gradient(1600px 1300px at 50% 30%,#000 78%,transparent 100%)}
main{position:relative;z-index:1;width:100%;max-width:520px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:36px 28px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;box-shadow:0 10px 26px var(--shadow)}
.avatar{width:72px;height:72px;border-radius:50%;object-fit:cover;padding:3px;background:var(--grad)}
h1{margin:0;font:600 clamp(36px,7vw,46px)/1.1 'Dancing Script',cursive;padding:0 .15em .2em;margin-bottom:-.2em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
p{margin:0;color:var(--text);max-width:30em}
.who{color:var(--fg);font-size:14.5px;margin-top:-4px}
.who .nm,.who .tt{display:block}
.who .nm{font-weight:700;font-size:16px}
.msg{font-style:italic}
/* on phones: keep the title on one line */
@media (max-width:560px){.who .tt{white-space:nowrap;font-size:min(14.5px,3.75vw)}main{padding:32px 16px}}
a.back{margin-top:8px;display:inline-flex;align-items:center;min-height:44px;padding:12px 24px;border-radius:10px;background:var(--grad-btn);color:#fff;font:700 15px/1 'Manrope',system-ui,sans-serif;text-decoration:none}
a.back:hover{filter:brightness(1.15)}
a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
</style>
</head>
<body>
<main>
  <img class="avatar" src="assets/profile.jpg" alt="Ketty Poinen">
  <p class="who"><span class="nm">Ketty Poinen</span> <span class="tt">Fractional AI consultant with a finance edge</span></p>
  <h1>Thank You</h1>
  <p class="msg">Your message is on its way to me.</p>
  <a class="back" href="index.html">Back to portfolio</a>
</main>
<!-- visit counter (GoatCounter: no cookies; skips local files) -->
<script data-goatcounter="https://pinkbot.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
